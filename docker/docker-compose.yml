version: "3.8"

# Core services (searxng + litellm) start with `docker compose up -d`.
# Observability (langfuse) is opt-in: `docker compose --profile obs up -d`.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: dr-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable   # rolling stable (well past the Mar-2026 bad versions).
    # TODO: re-pin to a verified `-stable` version tag (e.g. vX.Y.Z-stable) for reproducibility/security.
    container_name: dr-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ../.env
    extra_hosts:
      # lets the proxy reach Ollama / vLLM running on the host (Linux/WSL/Mac)
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped

  # ---- The pipeline app (run via `docker-compose run`, not auto-started) ----
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: deep-researcher-app
    container_name: dr-app
    profiles: ["app"]
    depends_on:
      - searxng
      - litellm
    env_file:
      - ../.env
    environment:
      # inside the compose network, reach services by name (not localhost)
      - OPENAI_BASE_URL=http://litellm:4000
      - SEARX_URL=http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config:/app/config               # edit pipeline.yaml without rebuilding
      - ../artifacts:/app/artifacts        # persisted research artifacts
      - ../vault_data:/app/vault_data       # optional duplicated wiki
      - hf-cache:/app/.hf_cache             # BGE-M3 + reranker weights (cached across runs)

  # ---- Observability (profile: obs) ----
  langfuse-db:
    image: postgres:16
    container_name: dr-langfuse-db
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: dr-langfuse
    profiles: ["obs"]
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: change-me-please
      SALT: change-me-please
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

volumes:
  langfuse-db-data:
  hf-cache:
