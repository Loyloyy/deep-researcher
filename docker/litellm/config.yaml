# =============================================================================
# LiteLLM proxy — THE single switch-point for model routing.
#
# CURRENT MODE: fully local via Ollama (no frontier APIs, no keys).
# GPT Researcher + the artifact/eval code always call the aliases
# strategic / smart / fast / judge. To change a model, edit only litellm_params below.
#
#   Ollama (local):  model: ollama_chat/<name>     api_base: os.environ/OLLAMA_BASE_URL
#   vLLM/SGLang   :  model: hosted_vllm/<served>   api_base: os.environ/VLLM_BASE_URL
#   OpenRouter    :  model: openrouter/<provider>/<model>   api_key: os.environ/OPENROUTER_API_KEY
#   Anthropic     :  model: anthropic/claude-opus-4-8       api_key: os.environ/ANTHROPIC_API_KEY
#
# The litellm CONTAINER reaches Ollama running on the HOST via host.docker.internal
# (see docker-compose extra_hosts + OLLAMA_BASE_URL in .env).
#
# Embeddings are NOT here — they run locally in-process (BGE-M3); see config/pipeline.yaml.
# =============================================================================

model_list:
  # Planner — decides what to research
  - model_name: strategic
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct
      api_base: os.environ/OLLAMA_BASE_URL

  # Writer — synthesizes the final report
  - model_name: smart
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct
      api_base: os.environ/OLLAMA_BASE_URL

  # Summarizer — high-volume per-source compression (keep small/fast)
  - model_name: fast
    litellm_params:
      model: ollama_chat/qwen2.5:3b-instruct
      api_base: os.environ/OLLAMA_BASE_URL

  # Eval judge — DIFFERENT family than the generator (qwen) to avoid self-preference bias
  - model_name: judge
    litellm_params:
      model: ollama_chat/llama3.1:8b-instruct
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  drop_params: true
  # Observability: uncomment to stream gateway traces to Langfuse (docker compose --profile obs up -d).
  # success_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
