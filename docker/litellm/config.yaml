# =============================================================================
# LiteLLM proxy — the router that puts 3 independent model endpoints behind ONE
# OpenAI-compatible URL (which is all GPT Researcher + our extract/eval code speak).
#
# YOU DON'T EDIT THIS FILE. It's a fixed template: each role's model id + endpoint +
# key are read from .env (STRATEGIC_*, SMART_*, FAST_*, JUDGE_*). Declare your 3 models
# (+ judge) there. Each role can independently be on-prem vLLM or a frontier API.
#
# Roles: strategic = planner · smart = report writer · fast = per-source summarizer
#        judge = eval only (different model family than the generator).
# =============================================================================

model_list:
  - model_name: strategic
    litellm_params:
      model: os.environ/STRATEGIC_MODEL
      api_base: os.environ/STRATEGIC_API_BASE
      api_key: os.environ/STRATEGIC_API_KEY

  - model_name: smart
    litellm_params:
      model: os.environ/SMART_MODEL
      api_base: os.environ/SMART_API_BASE
      api_key: os.environ/SMART_API_KEY

  - model_name: fast
    litellm_params:
      model: os.environ/FAST_MODEL
      api_base: os.environ/FAST_API_BASE
      api_key: os.environ/FAST_API_KEY

  - model_name: judge
    litellm_params:
      model: os.environ/JUDGE_MODEL_NAME
      api_base: os.environ/JUDGE_API_BASE
      api_key: os.environ/JUDGE_API_KEY

litellm_settings:
  drop_params: true
  # Observability: uncomment to stream gateway traces to Langfuse (docker compose --profile obs up -d).
  # success_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
